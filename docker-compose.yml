# =============================================================================
# ikabot-web - Docker Compose
# =============================================================================
# Installation from source:
#   cp .env.example .env
#   docker compose up -d --build
#
# Installation using prebuilt images:
#   cp .env.example .env
#   docker compose pull
#   docker compose up -d
#
# Notes:
# - hub_v2 and agent_v2 can be built locally or pulled from Docker Hub.
# - IkabotAPI is an external dependency and is not bundled in this repository.
# =============================================================================

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root-password}
      MARIADB_DATABASE: ${DB_NAME:-ikabot_hub}
      MARIADB_USER: ${DB_USER:-ikabot}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      TZ: America/Cuiaba
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hub:
    image: ${HUB_IMAGE:-blackoneal/ikabot-web-hub:latest}
    build:
      context: ./hub_v2
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,hub}
      ADMIN_CREATE: ${ADMIN_CREATE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ikabot.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_NAME: ${DB_NAME:-ikabot_hub}
      DB_USER: ${DB_USER:-ikabot}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_SECRET: ${APP_SECRET:-change-me-app-secret}
      AGENT_TOKEN: ${AGENT_TOKEN:-change-me-agent-token}
      WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}
      IKABOTAPI_URL: ${IKABOTAPI_URL:-}
      TZ: America/Cuiaba
    ports:
      - "${HUB_PORT:-8000}:8000"
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--access-logfile", "-", "--timeout", "120"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/agent/heartbeat/ || curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 10

  telegram-worker:
    image: ${HUB_IMAGE:-blackoneal/ikabot-web-hub:latest}
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-to-a-long-random-string}
      DB_NAME: ${DB_NAME:-ikabot_hub}
      DB_USER: ${DB_USER:-ikabot}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TZ: America/Cuiaba
    entrypoint: ["python", "manage.py"]
    command: ["telegram_poll"]

  agent:
    image: ${AGENT_IMAGE:-blackoneal/ikabot-web-agent:latest}
    build:
      context: ./agent_v2
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HUB_URL: ${HUB_URL:-http://hub:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_TOKEN: ${AGENT_TOKEN:-change-me-agent-token}
      AGENT_NODE_ID: ${AGENT_NODE_ID:-}
      AGENT_NAME: ${AGENT_NAME:-ikabot-agent-01}
      TZ: America/Cuiaba

  agent-vps-teste:
    image: ${AGENT_IMAGE:-blackoneal/ikabot-web-agent:latest}
    restart: unless-stopped
    depends_on:
      hub:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HUB_URL: ${HUB_URL:-http://hub:8000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_TOKEN: ${AGENT_TOKEN:-change-me-agent-token}
      AGENT_NODE_ID: "37062b20-eb8e-4b8d-ada6-b8f6b77379c3"
      AGENT_NAME: agent-vps-teste
      TZ: America/Cuiaba
    profiles:
      - extra-agent

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8080}:80"
    profiles:
      - tools

volumes:
  mariadb_data:
  redis_data:
