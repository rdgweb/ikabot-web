# =============================================================================
# ikabot-web - Docker Compose
# =============================================================================
# Instalação (recomendada): rode o instalador na pasta do projeto.
#   Linux:   ./install.sh
#   Windows: powershell -ExecutionPolicy Bypass -File .\install.ps1
# Ele gera o .env com senhas aleatórias, pergunta o modo de acesso e sobe tudo.
#
# Instalação à mão:
#   cp .env.example .env      # e preencha TODAS as senhas (não há valor padrão)
#   docker compose pull
#   docker compose up -d
#
# Perfis opcionais (COMPOSE_PROFILES no .env, separados por vírgula):
#   proxy  - Nginx Proxy Manager na frente do hub (portas 80/443, painel na 81)
#   tools  - phpMyAdmin, só para olhar o banco (em 127.0.0.1)
#   telegram - Telegram sem HTTPS: busca as mensagens e os botões em vez de esperar o webhook
#   supervisor - atualiza os agentes desta máquina pelo painel (Atualizações)
#   stats  - Umami: visitas do site público, sem cookie; o painel dele fica só em 127.0.0.1
#
# Código-fonte em vez das imagens publicadas:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
# Diferenças da sua máquina (um segundo agente, outra porta...) vão num
# docker-compose.override.yml, que o compose lê sozinho e o git ignora.
# =============================================================================

x-logging: &logging
  # sem limite, o log de cada container cresce até encher o disco
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    logging: *logging
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env (o instalador gera)}
      MARIADB_DATABASE: ${DB_NAME:-ikabot_hub}
      MARIADB_USER: ${DB_USER:-ikabot}
      MARIADB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env (o instalador gera)}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # só nesta máquina; para abrir, DB_BIND=0.0.0.0
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (o instalador gera)}"]
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      # só dentro do servidor: agentes em outra máquina falam com o hub por HTTPS (N-106), não com o Redis
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  hub:
    image: ${HUB_IMAGE:-blackoneal/ikabot-web-hub:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY no .env (o instalador gera)}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,hub}
      # o endereço pelo qual o hub é aberto (ex.: https://ikabot.seudominio.com); dele saem
      # também o host aceito e a origem do formulário de login quando as duas abaixo faltam
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      # o admin é criado na primeira subida com esta senha; depois a senha é a da tela
      ADMIN_CREATE: ${ADMIN_CREATE:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ikabot.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env (o instalador gera)}
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-false}
      DB_NAME: ${DB_NAME:-ikabot_hub}
      DB_USER: ${DB_USER:-ikabot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env (o instalador gera)}
      AGENT_TOKEN: ${AGENT_TOKEN:?defina AGENT_TOKEN no .env (o instalador gera)}
      # N-106: false = só a chave de cada nó abre a API do agente (desligue quando todos os agentes tiverem a sua)
      AGENT_SHARED_TOKEN_ENABLED: ${AGENT_SHARED_TOKEN_ENABLED:-true}
      WEBSHARE_API_KEY: ${WEBSHARE_API_KEY:-}
      IKABOTAPI_URL: ${IKABOTAPI_URL:-http://ikabotapi:5005}
      # controle manual (N-72): cada sessão é servida em <token>.<este domínio> pelo
      # gateway abaixo. Vazio = recurso desligado (o botão não aparece). Exige domínio.
      MANUAL_GATEWAY_DOMAIN: ${MANUAL_GATEWAY_DOMAIN:-}
      MANUAL_GATEWAY_SCHEME: ${MANUAL_GATEWAY_SCHEME:-https}
      MANUAL_GATEWAY_PORT: ${MANUAL_GATEWAY_PORT:-}
      # site público (N-119): endereço publicado, indexação e quem responde nos termos (vazio = não aparece)
      SITE_URL: ${SITE_URL:-}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      SITE_LEGAL_NAME: ${SITE_LEGAL_NAME:-}
      SITE_LEGAL_DOCUMENT: ${SITE_LEGAL_DOCUMENT:-}
      SITE_LEGAL_CITY: ${SITE_LEGAL_CITY:-}
      SITE_CONTACT_EMAIL: ${SITE_CONTACT_EMAIL:-}
      SITE_PRIVACY_EMAIL: ${SITE_PRIVACY_EMAIL:-}
      SITE_CONTACT_TELEGRAM: ${SITE_CONTACT_TELEGRAM:-}
      # estatística do site (perfil stats): o hub repassa só o script e a contagem ao Umami
      UMAMI_URL: ${UMAMI_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      # cobrança (N-124): chave da API do Asaas, sandbox até ASAAS_SANDBOX=false, token do webhook
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-true}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
      # e-mail (N-125): SMTP próprio com senha de app; sem ele o cadastro aberto não liga
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SIGNUP_OPEN: ${SIGNUP_OPEN:-false}
      # agente da plataforma (N-131): o Host Docker cujo supervisor cria os agentes dos clientes
      PLATFORM_AGENT_HOST_ID: ${PLATFORM_AGENT_HOST_ID:-}
      PLATFORM_AGENT_LIMIT: ${PLATFORM_AGENT_LIMIT:-10}
      PLATFORM_AGENT_MEMORY_MB: ${PLATFORM_AGENT_MEMORY_MB:-256}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # com o Nginx Proxy Manager na frente, o instalador põe HUB_BIND=127.0.0.1
      - "${HUB_BIND:-0.0.0.0}:${HUB_PORT:-8000}:8000"
    # threads (N-106): agents over HTTPS wait here for manual-control requests while a session is open
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "4", "--worker-class", "gthread", "--threads", "8", "--access-logfile", "-", "--timeout", "120"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/agent/heartbeat/ || curl -fsS http://127.0.0.1:8000/ || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 10

  # N-72: gateway das sessões do jogo (controle manual). Mesma imagem, código e banco do
  # hub, processo próprio com threads: um pedido aqui espera o jogo pelo agente, e os
  # workers do hub não devem ser os que esperam. O host curinga (*.MANUAL_GATEWAY_DOMAIN)
  # do proxy aponta para esta porta. Sem MANUAL_GATEWAY_DOMAIN só responde o health check.
  gateway:
    image: ${HUB_IMAGE:-blackoneal/ikabot-web-hub:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      hub:
        condition: service_healthy
      redis:
        condition: service_healthy
    # o entrypoint do hub roda as migrações; este só serve
    entrypoint: []
    command: ["gunicorn", "config.gateway_wsgi:application", "--bind", "0.0.0.0:8001", "--worker-class", "gthread", "--workers", "2", "--threads", "24", "--timeout", "120"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "false"
      DB_NAME: ${DB_NAME:-ikabot_hub}
      DB_USER: ${DB_USER:-ikabot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      APP_SECRET: ${APP_SECRET}
      MANUAL_GATEWAY_DOMAIN: ${MANUAL_GATEWAY_DOMAIN:-}
      MANUAL_GATEWAY_SCHEME: ${MANUAL_GATEWAY_SCHEME:-https}
      MANUAL_GATEWAY_PORT: ${MANUAL_GATEWAY_PORT:-}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/__ikabot/health || exit 1"]
      interval: 15s
      timeout: 6s
      retries: 10

  agent:
    image: ${AGENT_IMAGE:-blackoneal/ikabot-web-agent:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      hub:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HUB_URL: ${HUB_URL:-http://hub:8000}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      # N-106: a chave do próprio nó (Nós & Agents → Gerar nova chave); sem ela, a chave única da instalação
      AGENT_TOKEN: ${AGENT_NODE_TOKEN:-${AGENT_TOKEN}}
      # fixo: com ele vazio o agente sorteia outro a cada início e vira um nó novo no hub
      AGENT_NODE_ID: ${AGENT_NODE_ID:?defina AGENT_NODE_ID no .env (o instalador gera; à mão use uuidgen)}
      AGENT_NAME: ${AGENT_NAME:-ikabot-agent-01}
      AGENT_IMAGE: ${AGENT_IMAGE:-blackoneal/ikabot-web-agent:latest}
      AGENT_IMAGE_DIGEST: ${AGENT_IMAGE_DIGEST:-}
      TZ: ${TZ:-America/Sao_Paulo}

  ikabotapi:
    # Obrigatório: gera o token de login (blackbox) e resolve captchas; sem ele o hub
    # não entra no jogo. Sempre sobe, sem perfil. A imagem publicada é a mesma revisão
    # fixada abaixo (workflow ikabotapi-image); sem ela, o compose monta a partir do GitHub.
    image: ${IKABOTAPI_IMAGE:-blackoneal/ikabot-web-ikabotapi:fb87efe}
    build:
      # Fixado de propósito (N-74): um serviço de terceiros do qual todo login depende
      # não é reconstruído a partir do que o ramo tiver naquele dia. fb87efee é a revisão
      # testada aqui. Para mudar: ler as mudanças, testar um login, trocar o hash.
      # Ver ikabotapi_overrides/README.md.
      context: https://github.com/Ikabot-Collective/IkabotAPI.git#fb87efee84e476c74829a7a5a91cea5f3beeb93e
    restart: unless-stopped
    logging: *logging
    ports:
      - "${IKABOTAPI_BIND:-127.0.0.1}:${IKABOTAPI_PORT:-5005}:5005"
    volumes:
      # A lista do próprio projeto está desatualizada; esta mantém os tokens coerentes com
      # os navegadores do agente (agent_v2 USER_AGENTS) - ver ikabotapi_overrides/README.md (N-37).
      - ./ikabotapi_overrides/SupportedUserAgents.json:/ikabotapi/apps/token/SupportedUserAgents.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:5005/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── opcionais ────────────────────────────────────────────────────────────────

  # Nginx Proxy Manager (perfil "proxy"): recebe o domínio nas portas 80/443 e entrega ao
  # hub; com HTTPS, emite e renova o certificado sozinho. O painel fica na porta 81
  # (primeiro login admin@example.com / changeme). Veja docs/proxy.md.
  npm:
    image: jc21/nginx-proxy-manager:2.11.3
    restart: unless-stopped
    logging: *logging
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_ADMIN_BIND:-0.0.0.0}:${PROXY_ADMIN_PORT:-81}:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    profiles:
      - proxy

  # Supervisor (perfil "supervisor"): atualiza os agentes desta máquina pelo painel
  # (Atualizações), com volta automática se o novo não subir. Cadastre a máquina em
  # Nós & Agents > Docker Hosts e copie o id e o token para o .env. Não abre porta.
  supervisor:
    image: ${SUPERVISOR_IMAGE:-blackoneal/ikabot-web-supervisor:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      hub:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 192m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # dentro do compose fala com o hub pela rede interna; noutra máquina, o endereço HTTPS do hub
      HUB_URL: ${SUPERVISOR_HUB_URL:-http://hub:8000}
      IKABOT_HOST_ID: ${SUPERVISOR_HOST_ID:-}
      IKABOT_HOST_TOKEN: ${SUPERVISOR_HOST_TOKEN:-}
      SUPERVISOR_IMAGE: ${SUPERVISOR_IMAGE:-blackoneal/ikabot-web-supervisor:latest}
    profiles:
      - supervisor

  # Telegram sem HTTPS (perfil "telegram"): o Telegram só entrega mensagens e botões por
  # webhook em HTTPS público. Sem ele, este serviço busca as atualizações e as trata com o
  # mesmo código do webhook. Não ligue junto com um webhook ativo (o Telegram recusa os dois).
  telegram:
    image: ${HUB_IMAGE:-blackoneal/ikabot-web-hub:latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      hub:
        condition: service_healthy
    entrypoint: []
    command: ["python", "manage.py", "telegram_poll"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.base
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DB_NAME: ${DB_NAME:-ikabot_hub}
      DB_USER: ${DB_USER:-ikabot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mariadb
      DB_PORT: "3306"
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      APP_SECRET: ${APP_SECRET}
      HUB_PUBLIC_URL: ${HUB_PUBLIC_URL:-}
      TZ: ${TZ:-America/Sao_Paulo}
    profiles:
      - telegram

  # phpMyAdmin (perfil "tools"): só para olhar as tabelas; nada do sistema depende dele.
  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    logging: *logging
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PMA_HOST: mariadb
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:${PMA_PORT:-8080}:80"
    profiles:
      - tools

  # Umami (perfil "stats", N-119): conta as visitas do site público, sem cookie e sem guardar IP.
  # Nunca é publicado: o hub entrega o script e repassa a contagem (/stats/...); o painel do
  # Umami só abre em 127.0.0.1 (túnel SSH). Primeiro login admin / umami: troque na hora.
  umami:
    image: ${UMAMI_IMAGE:-ghcr.io/umami-software/umami:3}
    restart: unless-stopped
    logging: *logging
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:${UMAMI_PORT:-3001}:3000"
    mem_limit: 384m
    profiles:
      - stats

  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    profiles:
      - stats

volumes:
  mariadb_data:
  redis_data:
  npm_data:
  npm_letsencrypt:
  umami_db_data:
