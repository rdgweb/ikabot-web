{% if not active %}<span style="display:inline-flex;padding:.1rem .55rem;border-radius:999px;font-size:.7rem;font-weight:700;color:#9a3b2e;background:rgba(176,74,58,.14);">Pausada</span>
{% else %}<span style="display:inline-flex;padding:.1rem .55rem;border-radius:999px;font-size:.7rem;font-weight:700;{% if state.code == 'active' or state.code == 'exempt' %}color:#2f6b2f;background:rgba(95,140,78,.14);{% elif state.code == 'trial' %}color:#2d5f86;background:rgba(79,134,185,.14);{% elif state.code == 'overdue' %}color:#8a5a12;background:rgba(201,146,46,.16);{% else %}color:#9a3b2e;background:rgba(176,74,58,.14);{% endif %}">{{ state.label }}</span>{% endif %}
