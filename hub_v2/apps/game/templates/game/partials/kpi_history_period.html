<span class="inline-flex items-center" style="margin-left: auto; margin-right: .6rem; border: 1px solid rgba(79,134,185,0.35); border-radius: 999px; overflow: hidden; background: rgba(255,255,255,0.6);">
  <template x-for="option in historyPeriods" :key="option[0]">
    <button type="button" @click.stop="setHistoryPeriod(option[0])" x-text="option[2]" :title="'Histórico de ' + option[1]"
            :style="'border: 0; padding: 2px 9px; font-size: 10px; font-weight: 700; line-height: 1.7; cursor: pointer; ' + (historyPeriod === option[0] ? 'background: #4f86b9; color: #fff;' : 'background: transparent; color: #4f86b9;')"></button>
  </template>
</span>
