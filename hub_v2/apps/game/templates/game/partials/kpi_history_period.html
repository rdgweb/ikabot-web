<span class="inline-flex items-center gap-1" style="margin-left: auto; margin-right: .5rem;">
  <template x-for="option in historyPeriods" :key="option[0]">
    <button type="button" @click.stop="setHistoryPeriod(option[0])" x-text="option[0]" :title="'Histórico de ' + option[1]"
            :style="'border: 1px solid rgba(79,134,185,0.45); border-radius: 999px; padding: 0 .55rem; font-size: 10px; font-weight: 600; line-height: 1.7; cursor: pointer; ' + (historyPeriod === option[0] ? 'background: #4f86b9; color: #fff;' : 'background: transparent; color: #4f86b9;')"></button>
  </template>
</span>
