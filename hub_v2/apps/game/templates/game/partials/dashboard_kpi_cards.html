{% load static humanize %}
<div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
  <div class="card !p-3 flex items-center gap-2 cursor-pointer hover:ring-2 hover:ring-[var(--ik-sea)]/30 transition-all" @click="kpiModal='gold'">
    <img src="{% static 'game/resources/icon_gold.png' %}" class="w-6 h-6" alt="Ouro">
    <div>
      <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Ouro</p>
      <p class="text-base font-bold text-ink" x-text="fmt(kpi.gold)">{{ kpi.gold|intcomma }}</p>
    </div>
  </div>
  <div class="card !p-3 flex items-center gap-2 cursor-pointer hover:ring-2 hover:ring-[var(--ik-sea)]/30 transition-all" @click="kpiModal='income'">
    <i class="bi text-lg" :class="kpi.income >= 0 ? 'bi-graph-up-arrow' : 'bi-graph-down-arrow'"
       :style="kpi.income >= 0 ? 'color:#4fb44e' : 'color:#bb5143'"></i>
    <div>
      <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Renda/h</p>
      <p class="text-base font-bold" :class="kpi.income >= 0 ? 'text-green-600' : 'text-red-500'"
         x-text="(kpi.income > 0 ? '+' : '') + fmt(kpi.income)">{{ kpi.income|intcomma }}</p>
    </div>
  </div>
  <div class="card !p-3 flex items-center gap-2 cursor-pointer hover:ring-2 hover:ring-[var(--ik-sea)]/30 transition-all" @click="kpiModal='cities'">
    <i class="bi bi-geo-alt-fill text-lg" style="color: var(--ik-sea);"></i>
    <div>
      <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Cidades</p>
      <p class="text-base font-bold text-ink" x-text="kpi.cities">{{ kpi.cities }}</p>
    </div>
  </div>
  <div class="card !p-3 flex items-center gap-2 cursor-pointer hover:ring-2 hover:ring-[var(--ik-sea)]/30 transition-all" @click="kpiModal='resources'">

      <p class="text-base font-bold text-ink" x-text="fmt(kpi.resources)">{{ kpi.resources|intcomma }}</p>
    </div>

  <div class="card !p-3 flex items-center gap-2 cursor-pointer hover:ring-2 hover:ring-[var(--ik-sea)]/30 transition-all" @click="kpiModal='troops'">
    <i class="bi bi-shield-shaded text-lg" style="color: #c9553e;"></i>
    <div>
      <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Tropas</p>
      <p class="text-base font-bold text-ink" x-text="fmt(kpi.troops)">{{ kpi.troops|intcomma }}</p>
    </div>
  </div>
  <div class="card !p-3 flex items-center gap-2 cursor-pointer hover:ring-2 hover:ring-[var(--ik-sea)]/30 transition-all" @click="kpiModal='ships'">
    <i class="bi bi-water text-lg" style="color: var(--ik-sea);"></i>
    <div>
      <p class="text-[10px] font-semibold uppercase tracking-wider text-muted">Navios</p>
      <p class="text-base font-bold text-ink" x-text="fmt(kpi.ships)">{{ kpi.ships|intcomma }}</p>
    </div>
  </div>
</div>
