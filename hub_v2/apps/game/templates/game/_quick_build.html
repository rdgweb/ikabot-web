{# N-144: the "+" of a city in Construções — pick one or more buildings (raise or new) and the level of each; #}
{# they go as construction plan steps (merged into the account's active plan, or a new plan, like the plan form). #}
{% load static %}
<div x-data="quickBuild()" @quick-build.window="open($event.detail)" x-show="shown" x-cloak
     class="fixed inset-0 z-50 flex items-center justify-center p-4" style="background: rgba(30,22,10,0.45);"
     @keydown.escape.window="shown = false" @click.self="shown = false">
  <div class="card !p-0 w-full flex flex-col overflow-hidden" style="max-width: 46rem; max-height: 90vh;">
    <div class="flex items-center gap-3 border-b px-5 py-3" style="border-color: var(--ik-line);">
      <img src="{% static 'game/city/b/baustelle_statisch.png' %}" alt="" class="h-10 w-12 object-contain">
      <div class="min-w-0 flex-1">
        <h3 class="truncate text-lg font-bold text-ink" x-text="city.name"></h3>
        <div class="text-[11px] text-muted" x-text="gaName"></div>
      </div>
      <button type="button" class="text-muted hover:text-ink" @click="shown = false" aria-label="Fechar"><i class="bi bi-x-lg"></i></button>
    </div>

    <div class="overflow-y-auto px-5 py-4 space-y-4">
      <template x-for="group in groups()" :key="group.key">
        <section x-show="group.items.length">
          <div class="mb-2 text-[11px] font-semibold uppercase tracking-[0.16em]" style="color: var(--ik-sea);" x-text="group.label"></div>
          <div class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4">
            <template x-for="b in group.items" :key="b.key">
              <div class="relative rounded-xl border p-2 text-center transition-all cursor-pointer"
                   :style="picked[b.key] ? 'border-color: var(--ik-sea); background: rgba(79,134,185,0.08); box-shadow: 0 0 0 2px rgba(79,134,185,0.35);'
                                         : 'border-color: var(--ik-line); background: var(--ik-paper);'"
                   @click="toggle(b)">
                <span class="absolute right-1.5 top-1.5 flex h-5 w-5 items-center justify-center rounded-full border text-[11px]"
                      :style="picked[b.key] ? 'background: var(--ik-sea); border-color: var(--ik-sea); color: #fff;' : 'border-color: var(--ik-line); color: transparent;'">
                  <i class="bi bi-check-lg"></i></span>
                <img :src="b.icon" x-show="b.icon" alt="" class="mx-auto h-12 w-14 object-contain">
                <div class="mt-1 truncate text-[12px] font-semibold text-ink" x-text="b.name"></div>
                <div class="text-[10px] text-muted" x-text="b.mode === 'new' ? 'novo' : `nível ${b.level}${b.upgrading ? ' · em obra' : ''}`"></div>
                <div class="mt-1.5 flex items-center justify-center gap-1" x-show="picked[b.key]" @click.stop>
                  <button type="button" class="h-6 w-6 rounded border text-[12px]" style="border-color: var(--ik-line);" @click="step(b, -1)">−</button>
                  <input type="number" min="1" max="86" class="form-input text-center text-[12px]" style="width: 3.2rem; padding: 2px;"
                         x-model.number="picked[b.key]">
                  <button type="button" class="h-6 w-6 rounded border text-[12px]" style="border-color: var(--ik-line);" @click="step(b, 1)">+</button>
                </div>
              </div>
            </template>
          </div>
        </section>
      </template>
    </div>

    <div class="flex items-center gap-2 border-t px-5 py-3" style="border-color: var(--ik-line);">
      <span class="text-[12px] text-muted" x-text="count() ? `${count()} edifício${count() > 1 ? 's' : ''} · entra no plano de construção da conta` : 'Escolha um ou mais edifícios'"></span>
      <button type="button" class="btn btn-secondary btn-sm ml-auto" @click="shown = false">Cancelar</button>
      <button type="button" class="btn btn-primary btn-sm" :disabled="sending || !count()" @click="send()">
        <i class="bi" :class="sending ? 'bi-hourglass-split' : 'bi-hammer'"></i> Adicionar ao plano</button>
    </div>
  </div>
</div>
<script>
  function quickBuild() {
    return {
      shown: false, sending: false, ga: '', gaName: '', city: {id: '', name: '', upgrades: [], new: []}, picked: {},
      open(detail) {
        this.ga = detail.ga; this.gaName = detail.gaName || ''; this.city = detail.city; this.picked = {};
        this.shown = true;
      },
      groups() {
        return [
          {key: 'u', label: 'Evoluir', items: this.city.upgrades.map(b => ({...b, mode: 'upgrade', key: 'u:' + b.position}))},
          {key: 'n', label: 'Construir novo', items: this.city.new.map(b => ({...b, mode: 'new', key: 'n:' + b.building}))},
        ];
      },
      toggle(b) {
        if (this.picked[b.key]) { const p = {...this.picked}; delete p[b.key]; this.picked = p; }
        else this.picked = {...this.picked, [b.key]: b.mode === 'new' ? 1 : (b.level || 0) + 1};
      },
      step(b, delta) {
        const min = b.mode === 'new' ? 1 : (b.level || 0) + 1;
        this.picked = {...this.picked, [b.key]: Math.max(min, Math.min(86, (parseInt(this.picked[b.key]) || min) + delta))};
      },
      count() { return Object.keys(this.picked).length; },
      steps() {
        const all = [...this.groups()[0].items, ...this.groups()[1].items];
        return all.filter(b => this.picked[b.key]).map(b => b.mode === 'upgrade'
          ? {city_id: this.city.id, building_id: b.building, building_name: b.name, building_position: b.position, mode: 'upgrade',
             target_level: parseInt(this.picked[b.key])}
          : {city_id: this.city.id, building_id: b.building, building_name: b.name, mode: 'new', slot_types: b.slot_types,
             preferred_position: b.preferred_position, target_level: parseInt(this.picked[b.key])});
      },
      async send() {
        this.sending = true;
        const csrf = (document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/) || [])[1] || '';
        const body = new URLSearchParams({game_account: this.ga, action_code: '1002', auto_transport: 'on', freighter_threshold: '30000',
                                          queue_strategy: 'eta_first', research_reduction: '14', construction_plan_json: JSON.stringify(this.steps())});
        let toast = {type: 'error', message: 'Falha ao enviar a construção.'};
        try {
          const resp = await fetch("{% url 'jobs:job-submit' %}", {method: 'POST', body,
            headers: {'X-CSRFToken': decodeURIComponent(csrf), 'Content-Type': 'application/x-www-form-urlencoded'}});
          const trigger = JSON.parse(resp.headers.get('HX-Trigger') || '{}');
          if (trigger.toast) toast = trigger.toast;
          else if (resp.ok) toast = {type: 'success', message: 'Construção adicionada ao plano.'};
          if (toast.type === 'success') this.shown = false;
        } catch (e) {}
        window.dispatchEvent(new CustomEvent('toast', {detail: toast}));
        this.sending = false;
      },
    };
  }
</script>
