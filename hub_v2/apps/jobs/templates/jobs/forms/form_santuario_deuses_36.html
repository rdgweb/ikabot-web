{% load static hub_tags %}

    {% if action_code == 36 %}
    {{ worship_ui|json_script:"worship-ui-data" }}
    <div class="mb-5 rounded-[24px] border shadow-[0_12px_36px_rgba(60,45,18,0.10)]"
         style="border-color: var(--ik-line); background:
           radial-gradient(780px 280px at 0% 0%, rgba(201,156,78,0.14), transparent 60%),
           radial-gradient(700px 260px at 100% 100%, rgba(79,134,185,0.12), transparent 60%),
           linear-gradient(180deg, rgba(255,252,245,0.98), rgba(247,241,229,0.94));"
         x-data="{
           ui: {cities: [], gods: [], goods: []},
           isPreset: {% if preset %}true{% else %}false{% endif %},
           pick: {},
           init() {
             this.ui = JSON.parse(document.getElementById('worship-ui-data')?.textContent || '{}');
             let saved = {};
             try { saved = JSON.parse('{% if preset %}{{ form.by_good.value|default:''|escapejs }}{% else %}{{ form.worship.value|default:''|escapejs }}{% endif %}' || '{}'); } catch (e) {}
             this.rows().forEach(r => { this.pick[r.id] = Number(saved[r.id] || r.current || r.suggested || 0); });
           },
           rows() { return this.isPreset ? this.ui.goods.map(g => ({...g, name: `Cidades de ${g.label}`, current: 0})) : this.ui.cities; },
           god(id) { return this.ui.gods.find(g => g.id === Number(id)) || null; },
           changes() { return this.ui.cities.filter(c => this.pick[c.id] && this.pick[c.id] !== c.current); },
           column(godId) { this.rows().forEach(r => { this.pick[r.id] = godId; }); },
           suggestAll() { this.rows().forEach(r => { if (r.suggested) this.pick[r.id] = r.suggested; }); },
           payload() {
             const out = {};
             if (this.isPreset) { this.rows().forEach(r => { out[r.id] = this.pick[r.id]; }); }
             else { this.changes().forEach(c => { out[c.id] = this.pick[c.id]; }); }
             return JSON.stringify(out);
           }
         }">
      <input type="hidden" name="{{ form.worship.html_name }}" :value="isPreset ? '' : payload()">
      <input type="hidden" name="{{ form.by_good.html_name }}" :value="isPreset ? payload() : ''">

      <div class="flex flex-col gap-3 border-b px-5 py-4 md:flex-row md:items-center md:justify-between md:px-6"
           style="border-color: rgba(219,201,167,0.8);">
        <div class="flex items-center gap-3">
          <img src="{% static 'game/gods/favor.png' %}" alt="" class="h-10 w-10 object-contain">
          <div>
            <h3 class="text-lg font-bold text-ink">Deus de cada cidade</h3>
            <div class="text-[11px] text-muted" x-show="!isPreset"
                 x-text="(ui.summary ? `Santuário nível ${ui.summary.level}` : 'Sem leitura do santuário') + (ui.summary && ui.summary.room !== null ? ` · aceita mais ${ui.summary.room} cidade${ui.summary.room === 1 ? '' : 's'}` : '')"></div>
            <div class="text-[11px] text-muted" x-show="isPreset">Um deus para cada tipo de cidade, em todas as contas do preset.</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" class="rounded-full border px-3 py-1 text-[11px] font-semibold" style="border-color: rgba(95,140,78,0.45); color: var(--ik-good);" @click="suggestAll()">
            <i class="bi bi-magic"></i> Deus do luxo</button>
          <span class="rounded-full px-3 py-1 text-[11px] font-bold" x-show="!isPreset"
                :style="changes().length ? 'background: rgba(201,156,78,0.16); color: var(--ik-gold);' : 'background: rgba(0,0,0,0.05); color: var(--ik-muted);'"
                x-text="changes().length ? `${changes().length} a mudar` : 'nada a mudar'"></span>
        </div>
      </div>

      <div class="overflow-x-auto px-3 py-3 md:px-5">
        <table class="mx-auto w-full" style="max-width: 46rem; border-collapse: separate; border-spacing: 0 4px;">
          <thead>
            <tr>
              <th></th>
              <template x-for="g in ui.gods" :key="'h' + g.id">
                <th class="px-1 pb-1 text-center align-bottom" style="width: 13%;">
                  <button type="button" class="mx-auto flex flex-col items-center rounded-xl px-1 py-1 transition-colors hover:bg-[rgba(201,156,78,0.10)]"
                          @click="column(g.id)" :title="`Todas em ${g.name}`">
                    <img :src="g.image" alt="" class="h-11 w-11 rounded-xl object-contain" style="background: #fffdf8;">
                    <span class="mt-0.5 text-[11px] font-semibold text-ink" x-text="g.name"></span>
                    <span class="flex items-center gap-0.5 text-[9px] text-muted"><img :src="g.good_icon" alt="" class="h-3 w-3" x-show="g.good_icon"><span x-text="g.good"></span></span>
                  </button>
                </th>
              </template>
            </tr>
          </thead>
          <tbody>
            <template x-for="row in rows()" :key="row.id">
              <tr :style="!isPreset && pick[row.id] !== row.current ? 'background: rgba(201,156,78,0.10);' : 'background: rgba(255,255,255,0.7);'">
                <td class="rounded-l-xl py-1.5 pl-3 pr-2">
                  <div class="flex items-center gap-2">
                    <img :src="row.tradegood_icon || row.icon" alt="" class="h-5 w-5" x-show="row.tradegood_icon || row.icon">
                    <div class="min-w-0">
                      <div class="truncate text-[13px] font-semibold text-ink" x-text="row.name"></div>
                      <div class="text-[10px] text-muted" x-show="!isPreset"
                           x-text="!row.mapped ? 'leitura antiga' : (row.current ? `hoje: ${god(row.current)?.name}` : (row.has_slot ? 'sem deus' : 'fora do santuário'))"></div>
                    </div>
                  </div>
                </td>
                <template x-for="(g, i) in ui.gods" :key="row.id + '-' + g.id">
                  <td class="py-1.5 text-center" :class="i === ui.gods.length - 1 ? 'rounded-r-xl' : ''">
                    <button type="button" class="relative mx-auto flex items-center justify-center rounded-full transition-all"
                            :style="'width: 26px; height: 26px; ' + (pick[row.id] === g.id
                              ? 'background: var(--ik-gold); color: #fff; box-shadow: 0 0 0 3px rgba(201,156,78,0.25);'
                              : (row.current === g.id ? 'border: 2px solid rgba(120,110,95,0.55); background: #fff;' : 'border: 1px solid var(--ik-line); background: #fff;'))"
                            @click="pick[row.id] = g.id" :title="`${row.name} → ${g.name}`">
                      <i class="bi bi-check-lg text-[13px]" x-show="pick[row.id] === g.id"></i>
                      <span x-show="g.id === row.suggested && pick[row.id] !== g.id" class="rounded-full" style="width: 6px; height: 6px; background: var(--ik-good);"></span>
                    </button>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
        </table>
        <div class="mx-auto mt-1 flex flex-wrap gap-3 text-[10px] text-muted" style="max-width: 46rem;">
          <span><span class="inline-block rounded-full align-middle" style="width: 6px; height: 6px; background: var(--ik-good);"></span> deus do luxo da cidade</span>
          <span x-show="!isPreset"><span class="inline-block rounded-full align-middle" style="width: 9px; height: 9px; border: 2px solid rgba(120,110,95,0.55);"></span> deus de hoje</span>
          <span>clique no deus do topo para marcar a coluna inteira</span>
        </div>
      </div>
    </div>
    {% endif %}
