{% if service_incidents %}<aside class="status-banner" aria-label="Avisos de serviço"><div><strong><i class="bi bi-exclamation-circle" aria-hidden="true"></i> {{ service_incidents|length }} aviso(s) de serviço em acompanhamento</strong><p>{% for incident in service_incidents|slice:':3' %}{{ incident.title }}{% if not forloop.last %} · {% endif %}{% endfor %}</p></div><a class="btn btn-secondary" href="{% url 'service-status:list' %}">Ver situação do serviço</a></aside>{% endif %}
