{% load static %}{# one unit: a cut of the game's sheet, or the hub's own picture when the sheet has none (ships) #}<span class="cbu{% if not unit.sprite %} plain{% endif %}{% if unit.fallen %} fallen{% endif %}{% if small %} sm{% endif %}" title="{{ unit.name }}"{% if unit.sprite %} style="background-position: {{ unit.sprite }};"{% endif %}>{% if not unit.sprite and unit.icon %}<img src="{% static unit.icon %}" alt="">{% endif %}</span>
