{# ── Polling fragment para vinculacao global ── #}

<div class="text-center py-3">
  <div hx-get="{% url 'telegram:global-link-status' %}"
       hx-trigger="every 3s"
       hx-target="#global-link-area"
       hx-swap="innerHTML"
       hx-push-url="false"
       class="flex items-center justify-center gap-2 text-xs text-amber-600 mb-3">
    <span class="inline-block w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
    Aguardando vinculacao...
  </div>

  <button hx-get="{% url 'telegram:global-link-status' %}"
          hx-target="#global-link-area"
          hx-swap="innerHTML"
          hx-push-url="false"
          class="text-xs text-muted hover:text-red-600 transition-colors">
    <i class="bi bi-x-lg"></i> Cancelar
  </button>
</div>
