{# ── Single template row (collapsed) ── #}

<div id="tpl-row-{{ item.template.pk }}" class="border border-line rounded-lg">
  <button type="button"
          hx-get="{% url 'telegram:template-edit' item.template.pk %}"
          hx-target="#tpl-row-{{ item.template.pk }}"
          hx-swap="outerHTML"
          class="w-full flex items-center justify-between px-4 py-3 hover:bg-surface-alt transition-colors text-left">
    <div class="flex items-center gap-3">
      <span class="text-lg">{{ item.template.icon }}</span>
      <div>
        <span class="text-sm font-medium text-ink">{{ item.label }}</span>
        <p class="text-xs text-muted">{{ item.description }}</p>
      </div>
    </div>
    <i class="bi bi-pencil text-muted text-sm"></i>
  </button>
</div>
