{# ── One notice text, collapsed (N-104) ── #}

<div id="tpl-row-{{ item.template.pk }}" class="tg-row">
  <button type="button" class="tg-row-btn"
          hx-get="{% url 'telegram:template-edit' item.template.pk %}"
          hx-target="#tpl-row-{{ item.template.pk }}"
          hx-swap="outerHTML" hx-push-url="false">
    <span class="tg-row-icon">{{ item.template.icon }}</span>
    <span style="min-width: 0; flex: 1;">
      <b>{{ item.label }}{% if item.account_name %} · {{ item.account_name }}{% endif %}</b>
      <small>{{ item.template.title_template }}</small>
    </span>
    {% if item.overrides %}<span class="tg-tag" title="Contas com um texto próprio para este aviso">{{ item.overrides }} por conta</span>{% endif %}
    {% if not item.emitted %}<span class="tg-tag muted" title="Existe a chave e o texto, mas nenhuma ação envia este aviso ainda">sem envio</span>{% endif %}
    {% if item.sent %}<span class="tg-tag muted" title="Mensagens enviadas nos últimos 14 dias">{{ item.sent }} em 14 dias</span>{% endif %}
    <i class="bi bi-pencil text-muted text-sm"></i>
  </button>
</div>
