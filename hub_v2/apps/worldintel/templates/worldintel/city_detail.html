{% extends base_template|default:"base.html" %}
{% load static humanize hub_tags %}

{% block title %}{{ city.name }} — Inteligência{% endblock %}

{% block breadcrumb_items %}
  <span class="mx-1">/</span>
  <a href="{% url 'worldintel:players' %}{% if selected_game_account %}?ga={{ selected_game_account.pk }}{% endif %}" class="text-ink">Inteligência</a>
  <span class="mx-1">/</span>
  <a href="{{ player_url }}" class="text-muted">{{ city.owner_name }}</a>
  <span class="mx-1">/</span>
  <span class="text-muted">{{ city.name }}</span>
{% endblock %}

{% block content %}
<div class="space-y-4" x-data="{ reportModal: null }">

  {# ── Report HTML em <template> — dentro do block para ser renderizado ── #}
  {% for report in spy_reports %}{% if report.report_html %}<template id="rhtml-{{ report.pk }}">{{ report.report_html|safe }}</template>{% endif %}{% endfor %}

  {# ── Modal relatório HTML ── #}
  <div x-show="reportModal !== null" x-cloak
       x-transition:enter="transition ease-out duration-150"
       x-transition:enter-start="opacity-0"
       x-transition:enter-end="opacity-100"
       class="fixed inset-0 z-50 flex items-center justify-center p-4"
       style="background:rgba(0,0,0,0.5);"
       @click.self="reportModal = null"
       @keydown.escape.window="reportModal = null">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col" @click.stop>
      <div class="flex items-center justify-between px-4 py-3" style="border-bottom:1px solid var(--ik-line)">
        <span class="font-semibold text-ink text-sm">Relatório de espionagem</span>
        <button @click="reportModal = null" class="text-muted hover:text-ink transition-colors">
          <i class="bi bi-x-lg text-lg"></i>
        </button>
      </div>
      <div class="overflow-y-auto p-4 text-xs text-ink" x-html="reportModal"></div>
    </div>
  </div>

  {# ── Header ── #}
  <div class="card">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <div class="flex items-center gap-2 mb-1 flex-wrap">
          <i class="bi bi-building text-sea text-lg"></i>
          <h1 class="text-xl font-bold text-ink">{{ city.name }}</h1>
          <span class="font-mono text-muted text-sm">[{{ city.island.x }}:{{ city.island.y }}]</span>
          {% if city.in_fight %}
            <span class="badge badge-danger">⚔️ Em batalha</span>
          {% elif city.state == "vacation" %}
            <span class="badge badge-warning">🌴 Férias</span>
          {% elif city.state == "inactive_banned" %}
            <span class="badge badge-danger">🚫 Banido</span>
          {% elif city.state == "inactive" %}
            <span class="badge badge-secondary">💤 Inativo</span>
          {% endif %}
        </div>
        <p class="text-xs text-muted">
          Dono: <a href="{{ player_url }}" class="text-sea hover:underline">{{ city.owner_name }}</a>
          {% if city.ally_tag %} [{{ city.ally_tag }}]{% endif %}
          · Nível {{ city.level }}
          · Ilha: {{ city.island.name|default:"—" }}
          · Recurso: {{ city.island.resource_name|default:"—" }}{% if city.island.resource_level %} Lv{{ city.island.resource_level }}{% endif %}
          · ID: {{ city.game_city_id }}
        </p>
      </div>
      <div class="flex items-center gap-2 flex-shrink-0 flex-wrap">
        <a href="{{ player_url }}" class="btn btn-secondary btn-sm">
          <i class="bi bi-arrow-left text-[10px]"></i> Voltar
        </a>
        {% if city.game_city_id %}
        <a href="{{ spy_job_url }}"
           hx-get="{{ spy_job_url }}"
           hx-target="#job-modal-body"
           hx-swap="innerHTML"
           hx-push-url="false"
           hx-boost="false"
           onclick="openModal('jobcreate')"
           class="btn btn-primary btn-sm">
          <i class="bi bi-binoculars text-[10px]"></i> Espionar
        </a>
        <a href="{{ raid_job_url }}"
           hx-get="{{ raid_job_url }}"
           hx-target="#job-modal-body"
           hx-swap="innerHTML"
           hx-push-url="false"
           hx-boost="false"
           onclick="openModal('jobcreate')"
           class="btn btn-danger btn-sm">
          <i class="bi bi-lightning-charge-fill text-[10px]"></i> Roubar
        </a>
        {% endif %}
      </div>
    </div>
  </div>

  {# ── Intel por missão ── #}
  {% if latest_by_mission %}
  <div class="card">
    <h2 class="text-sm font-semibold text-ink mb-3">Intel por missão</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

      {% for mid, report in latest_by_mission.items %}
      {% if mid == 5 or mid == 6 or mid == 7 or mid == 26 %}
      {% with display=intel_display|get_item:mid %}
      <div class="rounded-xl overflow-hidden" style="border:1px solid var(--ik-line);">

        {# ── Card header ── #}
        <div class="flex items-center justify-between px-3 py-2"
             style="background:var(--ik-sand); border-bottom:1px solid var(--ik-line);">
          <div class="flex items-center gap-2 min-w-0">
            {% if mid == 3 %}
              <img src="{% static 'game/buildings/academy.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% elif mid == 5 %}
              <img src="{% static 'game/buildings/warehouse.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% elif mid == 6 %}
              <img src="{% static 'game/buildings/barracks.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% elif mid == 7 %}
              <img src="{% static 'game/buildings/shipyard.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% elif mid == 21 %}
              <img src="{% static 'game/buildings/governorsresidence.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% elif mid == 25 %}
              <img src="{% static 'game/buildings/townhall.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% elif mid == 26 %}
              <img src="{% static 'game/buildings/workshop.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% elif mid == 27 %}
              <img src="{% static 'game/buildings/seachartarchive.png' %}" class="w-5 h-5 object-contain flex-shrink-0">
            {% else %}
              <i class="bi bi-binoculars text-sea text-sm flex-shrink-0"></i>
            {% endif %}
            <span class="text-xs font-semibold text-ink truncate">{{ report.mission_name|default:report.subject|default:"Missão" }}</span>
            <span class="text-[10px] text-muted font-mono flex-shrink-0">M{{ mid }}</span>
          </div>
          <div class="flex items-center gap-1.5 flex-shrink-0 ml-2">
            {% if report.is_valid %}
              <span class="badge badge-success text-[10px]">✓ Válido</span>
            {% elif report.expires_at %}
              <span class="badge badge-warning text-[10px]">⚠ Expirado</span>
            {% else %}
              <span class="badge badge-secondary text-[10px]">—</span>
            {% endif %}
            {% if report.report_html %}
            <button type="button"
                    @click="reportModal = document.getElementById('rhtml-{{ report.pk }}').innerHTML"
                    class="btn btn-secondary text-[10px] px-1.5 py-0.5 h-auto leading-none"
                    title="Ver relatório completo">
              <i class="bi bi-file-text"></i>
            </button>
            {% endif %}
          </div>
        </div>

        {# ── Card body — dados de intel ── #}
        <div class="p-3" style="background:var(--ik-sand-light);">

          {% if display %}

            {# ─ RECURSOS (M5) ─ #}
            {% if display.type == "resources" %}
            <div class="grid grid-cols-3 gap-1.5">
              {% for res in display.resources %}
              <div class="flex items-center gap-1.5 rounded-lg px-2 py-1.5 bg-white shadow-sm">
                <img src="{% static res.icon %}" class="w-5 h-5 flex-shrink-0" title="{{ res.label }}">
                <div class="min-w-0">
                  <div class="text-[10px] text-muted leading-none truncate">{{ res.label }}</div>
                  <div class="text-xs font-bold text-ink font-mono">{{ res.value|intcomma }}</div>
                </div>
              </div>
              {% endfor %}
            </div>

            {# ─ TROPAS / FROTAS (M6, M7) ─ #}
            {% elif display.type == "troops" %}
            <div class="space-y-3">
              {% for section in display.sections %}
              <div>
                <div class="flex items-center gap-1 mb-2">
                  {% if section.category_type == "naval" %}
                    <img src="{% static 'game/buildings/shipyard.png' %}" class="w-3.5 h-3.5 opacity-50">
                  {% else %}
                    <img src="{% static 'game/buildings/barracks.png' %}" class="w-3.5 h-3.5 opacity-50">
                  {% endif %}
                  <span class="text-[10px] font-semibold text-muted uppercase tracking-wider">{{ section.category }}</span>
                </div>
                <div class="flex flex-wrap gap-2">
                  {% for unit in section.units %}
                  <div class="text-center bg-white rounded-xl px-2 pt-2 pb-1.5 shadow-sm" style="min-width:56px; border:1px solid var(--ik-line);">
                    <img src="{% static unit.icon %}" class="w-9 h-9 mx-auto object-contain" title="{{ unit.name }}">
                    <div class="text-xs font-bold text-ink mt-1">{{ unit.count|intcomma }}</div>
                    <div class="text-[9px] text-muted truncate" style="max-width:60px" title="{{ unit.name }}">{{ unit.name }}</div>
                    {% if unit.offensive or unit.defensive %}
                    <div class="flex justify-center gap-1 mt-0.5">
                      <span class="text-[9px] font-mono text-amber-600" title="Ofensivo">⚔+{{ unit.offensive }}</span>
                      <span class="text-[9px] font-mono text-sky-600" title="Defensivo">🛡+{{ unit.defensive }}</span>
                    </div>
                    {% endif %}
                  </div>
                  {% endfor %}
                </div>
              </div>
              {% if not forloop.last %}
              <div style="height:1px; background:var(--ik-line);"></div>
              {% endif %}
              {% endfor %}
            </div>

            {# ─ PESQUISA (M3) ─ #}
            {% elif display.type == "research" %}
            <div class="grid grid-cols-2 gap-1.5">
              {% for field, level in display.research.items %}
              <div class="flex items-center justify-between bg-white rounded-lg px-2.5 py-1.5 shadow-sm gap-2"
                   style="border:1px solid var(--ik-line);">
                <span class="text-[11px] text-muted truncate" title="{{ field }}">{{ field }}</span>
                <span class="text-xs font-bold text-sea flex-shrink-0">{{ level }}</span>
              </div>
              {% endfor %}
            </div>

            {# ─ WORKSHOP (M26) ─ #}
            {% elif display.type == "workshop" %}
            <div class="space-y-1.5">
              {% for imp in display.improvements %}
              <div class="flex items-center gap-2 bg-white rounded-lg px-2 py-1.5 shadow-sm"
                   style="border:1px solid var(--ik-line);">
                <img src="{% static imp.icon %}" class="w-8 h-8 flex-shrink-0 object-contain" title="{{ imp.name }}">
                <span class="text-xs text-ink flex-1 truncate" title="{{ imp.name }}">{{ imp.name }}</span>
                <div class="flex items-center gap-2 flex-shrink-0">
                  <span class="text-[11px] font-mono font-semibold text-amber-600" title="Ofensivo">⚔ +{{ imp.offensive }}</span>
                  <span class="text-[11px] font-mono font-semibold text-sky-600" title="Defensivo">🛡 +{{ imp.defensive }}</span>
                </div>
              </div>
              {% endfor %}
            </div>

            {# ─ SUMÁRIO (outros) ─ #}
            {% elif display.type == "summary" and display.text %}
            <p class="text-xs text-muted leading-relaxed">{{ display.text }}</p>

            {% endif %}

          {% else %}
            {# Sem dados estruturados — texto bruto #}
            {% if report.report_text %}
              <p class="text-xs text-muted leading-relaxed">{{ report.report_text|truncatechars:200 }}</p>
            {% else %}
              <p class="text-xs text-muted italic">Sem dados detalhados disponíveis.</p>
            {% endif %}
          {% endif %}

        </div>

        {# ── Card footer ── #}
        <div class="flex items-center justify-between px-3 py-1.5"
             style="background:var(--ik-sand); border-top:1px solid var(--ik-line);">
          <span class="text-[10px] text-muted">{{ report.created_at|naturaltime }}</span>
          <div class="flex items-center gap-1.5">
            <span class="text-[10px] {% if report.is_mission_success %}text-green-600{% else %}text-red-500{% endif %} font-medium">
              {% if report.is_mission_success %}✓{% else %}✗{% endif %}
              {{ report.result_status|default:"—"|truncatechars:35 }}
            </span>
            {% if report.agents_lost %}
              <span class="text-[10px] text-red-500" title="Espiões perdidos">⚠ -{{ report.agents_lost }}</span>
            {% endif %}
          </div>
        </div>

      </div>
      {% endwith %}
      {% endif %}
      {% endfor %}

    </div>
  </div>
  {% endif %}

  {# ── Histórico completo de relatórios ── #}
  <div class="card !p-0 overflow-hidden">
    <div class="px-4 py-3 flex items-center justify-between" style="border-bottom:1px solid var(--ik-line);">
      <h2 class="text-sm font-semibold text-ink">Histórico de relatórios</h2>
      <span class="text-xs text-muted">{{ spy_reports|length }} registros</span>
    </div>

    {% if spy_reports %}
    <div class="overflow-x-auto">
      <table class="w-full text-xs">
        <thead>
          <tr style="border-bottom:2px solid var(--ik-line); background:var(--ik-sand);">
            <th class="py-2 px-3 text-left text-muted font-semibold">Data</th>
            <th class="py-2 px-3 text-left text-muted font-semibold">Missão</th>
            <th class="py-2 px-3 text-left text-muted font-semibold">Conta</th>
            <th class="py-2 px-3 text-center text-muted font-semibold">Resultado</th>
            <th class="py-2 px-3 text-center text-muted font-semibold">Agentes</th>
            <th class="py-2 px-3 text-center text-muted font-semibold">Validade</th>
            <th class="py-2 px-3 text-center text-muted font-semibold">Job</th>
            <th class="py-2 px-3 text-center text-muted font-semibold">Ver</th>
          </tr>
        </thead>
        <tbody>
          {% for report in spy_reports %}
          <tr class="hover:bg-[var(--ik-sand-light)] transition-colors" style="border-bottom:1px solid var(--ik-line);">
            <td class="py-2 px-3 text-muted whitespace-nowrap">{{ report.created_at|date:"d/m/y H:i" }}</td>
            <td class="py-2 px-3 font-medium text-ink">{{ report.mission_name|default:report.subject|default:"—" }}</td>
            <td class="py-2 px-3 text-muted">{{ report.game_account.name|default:"—" }}</td>
            <td class="py-2 px-3 text-center">
              {% if report.is_mission_success %}
                <span class="badge badge-success text-[10px]">✓ Sucesso</span>
              {% elif report.result_status %}
                <span class="badge badge-danger text-[10px]">✗ {{ report.result_status|truncatechars:25 }}</span>
              {% else %}
                <span class="text-muted">—</span>
              {% endif %}
            </td>
            <td class="py-2 px-3 text-center font-mono">
              {{ report.agents_sent }}
              {% if report.agents_lost %}<span class="text-red-500 ml-1">-{{ report.agents_lost }}</span>{% endif %}
            </td>
            <td class="py-2 px-3 text-center">
              {% if report.is_valid %}
                <span class="badge badge-success text-[10px]">✓ Válido</span>
              {% elif report.expires_at %}
                <span class="badge badge-secondary text-[10px]">Expirado</span>
              {% else %}
                <span class="text-muted text-[10px]">—</span>
              {% endif %}
            </td>
            <td class="py-2 px-3 text-center">
              {% if report.action_job_id %}
              <div>
                <a href="{% url 'jobs:job-detail' report.action_job_id %}"
                   class="text-sea hover:underline font-mono text-[10px]"
                   title="Ver job que executou a miss?o">
                  a??o {{ report.action_job_id|stringformat:"s"|slice:":8" }}
                </a>
              </div>
              {% endif %}
              {% if report.created_by_job_id %}
              <div>
                <a href="{% url 'jobs:job-detail' report.created_by_job_id %}"
                   class="text-sea hover:underline font-mono text-[10px]"
                   title="Ver job que coletou">
                  leitura {{ report.created_by_job_id|stringformat:"s"|slice:":8" }}
                </a>
              </div>
              {% elif not report.action_job_id %}
                <span class="text-muted">???</span>
              {% endif %}
            </td>
            <td class="py-2 px-3 text-center">
              {% if report.report_html %}
              <button type="button"
                      @click="reportModal = document.getElementById('rhtml-{{ report.pk }}').innerHTML"
                      class="btn btn-secondary text-[10px] px-1.5 py-0.5 h-auto leading-none"
                      title="Ver relatório">
                <i class="bi bi-file-text"></i>
              </button>
              {% else %}
                <span class="text-muted">—</span>
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <div class="py-10 text-center text-sm text-muted">
      <i class="bi bi-binoculars text-2xl mb-2 block opacity-30"></i>
      Nenhum relatório de espionagem para esta cidade.
      {% if city.game_city_id %}
      <div class="mt-2">
        <a href="{{ spy_job_url }}"
           hx-get="{{ spy_job_url }}"
           hx-target="#job-modal-body"
           hx-swap="innerHTML"
           hx-push-url="false"
           hx-boost="false"
           onclick="openModal('jobcreate')"
           class="btn btn-primary btn-sm">
          <i class="bi bi-binoculars text-[10px]"></i> Espionar agora
        </a>
      </div>
      {% endif %}
    </div>
    {% endif %}
  </div>

</div>
{% endblock %}
