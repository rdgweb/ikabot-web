</style>
<script>
(() => {
  if (window.ikSupportErrorsReady) return;
  window.ikSupportErrorsReady = true;
  document.addEventListener('htmx:beforeSwap', event => {
    if (![400, 409].includes(event.detail.xhr.status)) return;
    const url = new URL(event.detail.xhr.responseURL, location.href);
    if (url.origin === location.origin && url.pathname.startsWith('/suporte/')) {
      event.detail.shouldSwap = true;
      event.detail.isError = false;
    }
  });
})();
</script>
