{% extends "website/base.html" %}

{% block content %}
<div class="page-head">
  <div class="wrap narrow">
    <h1>{{ ui.nav.faq }}</h1>
  </div>
</div>

<section style="padding-top: 10px;">
  <div class="wrap narrow faq">
    {% for q, a in faq %}
    <details{% if forloop.first %} open{% endif %}><summary>{{ q }}</summary><p>{{ a }}</p></details>
    {% endfor %}
    <div class="card center" style="margin-top: 26px;">
      <p style="margin-bottom: 14px;">{% if open_signup %}{{ ui.beta_open }}{% else %}{{ ui.beta }}{% endif %}</p>
      <a class="btn btn-primary" href="{{ cta.href }}"><i class="bi {{ cta.icon }}"></i> {{ cta.label }}</a>
    </div>
  </div>
</section>
{% endblock %}
