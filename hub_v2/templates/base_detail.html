{% extends "base.html" %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-ink">{% block detail_title %}Detalhe{% endblock %}</h1>
    <p class="text-sm text-muted mt-1">{% block detail_subtitle %}{% endblock %}</p>
  </div>
  <div class="flex gap-2">
    {% block detail_actions %}{% endblock %}
  </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
  <!-- Main content -->
  <div class="lg:col-span-2 space-y-6">
    {% block detail_main %}{% endblock %}
  </div>
  <!-- Sidebar -->
  <div class="space-y-6">
    {% block detail_sidebar %}{% endblock %}
  </div>
</div>
{% endblock %}
