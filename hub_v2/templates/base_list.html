{% extends base_template|default:"base.html" %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-2xl font-bold text-ink">{% block page_title %}Lista{% endblock %}</h1>
    <p class="text-sm text-muted mt-1">{% block page_subtitle %}{% endblock %}</p>
  </div>
  <div class="flex gap-2 items-center">
    {% block filter_dropdown %}{% endblock %}
    {% block page_actions %}{% endblock %}
  </div>
</div>

<!-- Table content (HTMX target). table_content_attrs lets a page attach state (e.g.
     Alpine x-data) that must survive HTMX swaps of the content inside — see
     jobs/workflow_list.html for why (bulk-selection state otherwise resets on every
     page/filter change, since hx-swap="innerHTML" replaces everything inside). -->
<div id="table-content" {% block table_content_attrs %}{% endblock %}>
  {% block table_content %}{% endblock %}
</div>
{% endblock %}
