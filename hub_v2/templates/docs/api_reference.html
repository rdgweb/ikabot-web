<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ api_title }} v{{ api_version }}</title>
  <style>
    body {
      margin: 0;
      background: #f4efe6;
      color: #1f2937;
      font-family: "Segoe UI", sans-serif;
    }
    #app {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
  <script>
    Scalar.createApiReference('#app', {
      url: '{{ schema_url }}',
      proxyUrl: '',
      pageTitle: '{{ api_title }}',
      theme: 'kepler',
      defaultHttpClient: {
        targetKey: 'python',
        clientKey: 'requests'
      }
    })
  </script>
</body>
</html>
