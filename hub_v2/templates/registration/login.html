<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — ikabot hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/output.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body style="font-family: 'Source Sans 3', 'Segoe UI', sans-serif; color: #2d2a24;
             background: radial-gradient(760px 420px at 100% 0%, rgba(201,156,78,0.15), transparent 58%),
                         radial-gradient(620px 420px at 0% 100%, rgba(95,140,78,0.10), transparent 64%),
                         linear-gradient(180deg, #efe4d1, #f7f1e5);"
     class="min-h-screen flex items-center justify-center">

  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold" style="font-family: Rajdhani, 'Segoe UI', sans-serif; color: #654b1f; text-transform: uppercase; letter-spacing: 1px;">
        <i class="bi bi-controller" style="color: #c99c4e;"></i> ikabot hub
      </h1>
      <p class="text-sm mt-1" style="color: #6f6b63;">Faca login para continuar</p>
    </div>

    <div class="rounded-xl p-6" style="background: #fffdf7; border: 1px solid #dbc9a7; box-shadow: 0 4px 16px rgba(87,66,24,0.12);">
      {% if form.errors %}
      <div class="mb-4 p-3 rounded-lg text-sm" style="background: #fde8e5; border: 1px solid #e8b4af; color: #8c3028;">
        <i class="bi bi-exclamation-circle"></i>
        Usuario ou senha invalidos.
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="mb-4">
          <label for="id_username" class="block text-sm font-semibold mb-1.5" style="color: #4a4639;">Usuario</label>
          <input type="text" name="username" id="id_username" autofocus
                 class="form-input w-full" placeholder="seu.usuario">
        </div>

        <div class="mb-6">
          <label for="id_password" class="block text-sm font-semibold mb-1.5" style="color: #4a4639;">Senha</label>
          <input type="password" name="password" id="id_password"
                 class="form-input w-full" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary w-full">
          <i class="bi bi-box-arrow-in-right"></i> Entrar
        </button>
      </form>
    </div>

    <p class="text-center text-xs mt-6" style="color: #b5ad9a;">
      ikabot hub v{{ HUB_VERSION|default:"0.0.1" }}
    </p>
  </div>
</body>
</html>
