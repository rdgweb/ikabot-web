{# Empty state for tables/lists #}
{# Usage: include "components/table/empty.html" with icon="bi-inbox" message="Nenhum item encontrado" #}
<div class="text-center py-12">
  <i class="bi {{ icon|default:'bi-inbox' }} text-4xl" style="color: #b5ad9a;"></i>
  <p class="mt-3 text-sm text-muted">{{ message|default:"Nenhum resultado encontrado." }}</p>
  {% if action_url %}
  <a href="{{ action_url }}" class="btn btn-primary btn-sm mt-4">
    <i class="bi bi-plus-lg"></i> {{ action_label|default:"Criar novo" }}
  </a>
  {% endif %}
</div>
