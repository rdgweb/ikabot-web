{% load static %}
<!-- Loading indicators: 2 estilos, toggle via botão no canto. Pref em localStorage ikLoadingStyle -->

<!-- Style 2: Mar cobre 45% da tela — caustics no corpo + 5 ondas na linha d'água -->
<div id="loading-sea" class="loading-sea">
  <div class="loading-sea-bg"></div>

  <!-- Onda 1: lenta e larga, 110px, azul escuro principal -->
  <svg class="loading-sea-wave loading-sea-wave-1" viewBox="0 0 1440 110" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(10,40,95,0.97)"
      d="M0,70 C180,40 360,100 540,70 C720,40 900,100 1080,70
         C1260,40 1440,100 1620,70 C1800,40 1980,100 2160,70
         C2340,40 2520,100 2700,70 C2880,40 3060,100 3240,70
         C3420,40 3600,100 3780,70 C3960,40 4140,100 4320,70
         L4320,110 L0,110 Z"/>
  </svg>

  <!-- Onda 2: reversa, 95px, ligeiramente mais clara -->
  <svg class="loading-sea-wave loading-sea-wave-2" viewBox="0 0 1440 95" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(12,52,118,0.88)"
      d="M0,60 C200,35 400,80 600,60 C800,35 1000,80 1200,60
         C1400,35 1600,80 1800,60 C2000,35 2200,80 2400,60
         C2600,35 2800,80 3000,60 C3200,35 3400,80 3600,60
         C3800,35 4000,80 4200,60 L4200,95 L0,95 Z"/>
  </svg>

  <!-- Onda 3: 80px, período mais curto -->
  <svg class="loading-sea-wave loading-sea-wave-3" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(15,65,140,0.72)"
      d="M0,50 C160,28 320,65 480,50 C640,28 800,65 960,50
         C1120,28 1280,65 1440,50 C1600,28 1760,65 1920,50
         C2080,28 2240,65 2400,50 C2560,28 2720,65 2880,50
         C3040,28 3200,65 3360,50 C3520,28 3680,65 3840,50
         C4000,28 4160,65 4320,50 L4320,80 L0,80 Z"/>
  </svg>

  <!-- Onda 4: 68px, superfície azul mais viva -->
  <svg class="loading-sea-wave loading-sea-wave-4" viewBox="0 0 1440 68" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(22,88,175,0.55)"
      d="M0,42 C120,24 240,55 360,42 C480,24 600,55 720,42
         C840,24 960,55 1080,42 C1200,24 1320,55 1440,42
         C1560,24 1680,55 1800,42 C1920,24 2040,55 2160,42
         C2280,24 2400,55 2520,42 C2640,24 2760,55 2880,42
         C3000,24 3120,55 3240,42 C3360,24 3480,55 3600,42
         C3720,24 3840,55 3960,42 C4080,24 4200,55 4320,42
         L4320,68 L0,68 Z"/>
  </svg>

  <!-- Onda 5: 55px, espuma rápida e translúcida -->
  <svg class="loading-sea-wave loading-sea-wave-5" viewBox="0 0 1440 55" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(55,135,215,0.30)"
      d="M0,34 C100,20 200,44 300,34 C400,20 500,44 600,34
         C700,20 800,44 900,34 C1000,20 1100,44 1200,34
         C1300,20 1400,44 1440,34 C1540,20 1640,44 1740,34
         C1840,20 1940,44 2040,34 C2140,20 2240,44 2340,34
         C2440,20 2540,44 2640,34 C2740,20 2840,44 2940,34
         C3040,20 3140,44 3240,34 C3340,20 3440,44 3540,34
         C3640,20 3740,44 3840,34 C3940,20 4040,44 4140,34
         C4240,20 4320,44 4320,34 L4320,55 L0,55 Z"/>
  </svg>
</div>

<!-- Style 3: Spinner grande centralizado -->
<div id="loading-spinner" class="loading-spinner">
  <div class="loading-spinner-wrap">
    <div class="loading-spinner-outer">
      <svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="110" cy="110" r="104" stroke="rgba(79,134,185,0.15)" stroke-width="5"/>
        <circle cx="110" cy="110" r="104" stroke="url(#arc-grad-outer)" stroke-width="5" stroke-dasharray="160 495" stroke-linecap="round" transform="rotate(-90 110 110)"/>
        <defs>
          <linearGradient id="arc-grad-outer" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7ec8e3" stop-opacity="0.1"/>
            <stop offset="50%" stop-color="#4f86b9" stop-opacity="1"/>
            <stop offset="100%" stop-color="#7ec8e3" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="loading-spinner-inner">
      <svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="90" cy="90" r="82" stroke="rgba(201,156,78,0.12)" stroke-width="3"/>
        <circle cx="90" cy="90" r="82" stroke="url(#arc-grad-inner)" stroke-width="3" stroke-dasharray="90 425" stroke-linecap="round" transform="rotate(90 90 90)"/>
        <defs>
          <linearGradient id="arc-grad-inner" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c99c4e" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#c99c4e" stop-opacity="0.95"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <img class="loading-spinner-icon" src="{% static 'game/units/trieme.png' %}" alt="">
    <span class="loading-spinner-label">Navegando...</span>
  </div>
</div>

<!-- Style toggle button (bottom-right corner) -->
{% if user.is_authenticated %}
<button id="ik-loading-toggle" class="ik-loading-toggle" onclick="ikCycleLoadingStyle()" title="Estilo de loading">
  <i class="bi bi-stars"></i>
</button>
{% endif %}

<script>
(function () {
  var STYLES = ['2', '3'];
  var LABELS  = { '2': 'Mar', '3': 'Spinner' };

  function getStyle() {
    var s = localStorage.getItem('ikLoadingStyle') || '3';
    return STYLES.indexOf(s) >= 0 ? s : '3';
  }
  function setStyle(s) { localStorage.setItem('ikLoadingStyle', s); applyStyle(s); }

  function applyStyle(s) {
    ['loading-sea', 'loading-spinner'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.setAttribute('data-style', s);
    });
    var btn = document.getElementById('ik-loading-toggle');
    if (btn) btn.title = 'Loading: ' + (LABELS[s] || s) + ' (clique para trocar)';
  }

  window.ikCycleLoadingStyle = function () {
    var idx  = STYLES.indexOf(getStyle());
    var next = STYLES[(idx + 1) % STYLES.length];
    setStyle(next);
  };

  applyStyle(getStyle());
})();
</script>
