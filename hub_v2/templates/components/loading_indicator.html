{% load static %}
<!-- Loading indicators: 2 estilos, toggle via botão no canto. Pref em localStorage ikLoadingStyle -->

<!-- Style 2: Mar cobre 45% da tela — fundo com shimmer + 5 ondas na linha d'água -->
<div id="loading-sea" class="loading-sea">
  <div class="loading-sea-bg"></div>

  <!-- Camada 1: onda larga e lenta — cor base do oceano, 100px altura fixa -->
  <svg class="loading-sea-wave loading-sea-wave-1" viewBox="0 0 1440 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(9,37,85,0.98)"
      d="M0,30 C240,5 480,55 720,30 C960,5 1200,55 1440,30
         C1680,5 1920,55 2160,30 C2400,5 2640,55 2880,30
         C3120,5 3360,55 3600,30 C3840,5 4080,55 4320,30
         L4320,100 L0,100 Z"/>
  </svg>

  <!-- Camada 2: reversa, levemente mais clara -->
  <svg class="loading-sea-wave loading-sea-wave-2" viewBox="0 0 1440 90" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(11,48,108,0.9)"
      d="M0,28 C200,8 400,48 600,28 C800,8 1000,48 1200,28
         C1400,8 1600,48 1800,28 C2000,8 2200,48 2400,28
         C2600,8 2800,48 3000,28 C3200,8 3400,48 3600,28
         C3800,8 4000,48 4200,28 L4200,90 L0,90 Z"/>
  </svg>

  <!-- Camada 3: período mais curto, tons intermediários -->
  <svg class="loading-sea-wave loading-sea-wave-3" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(14,62,135,0.75)"
      d="M0,25 C160,8 320,42 480,25 C640,8 800,42 960,25
         C1120,8 1280,42 1440,25 C1600,8 1760,42 1920,25
         C2080,8 2240,42 2400,25 C2560,8 2720,42 2880,25
         C3040,8 3200,42 3360,25 C3520,8 3680,42 3840,25
         C4000,8 4160,42 4320,25 L4320,80 L0,80 Z"/>
  </svg>

  <!-- Camada 4: superfície, azul mais vivo -->
  <svg class="loading-sea-wave loading-sea-wave-4" viewBox="0 0 1440 70" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(20,85,168,0.6)"
      d="M0,22 C120,8 240,36 360,22 C480,8 600,36 720,22
         C840,8 960,36 1080,22 C1200,8 1320,36 1440,22
         C1560,8 1680,36 1800,22 C1920,8 2040,36 2160,22
         C2280,8 2400,36 2520,22 C2640,8 2760,36 2880,22
         C3000,8 3120,36 3240,22 C3360,8 3480,36 3600,22
         C3720,8 3840,36 3960,22 C4080,8 4200,36 4320,22
         L4320,70 L0,70 Z"/>
  </svg>

  <!-- Camada 5: espuma rápida, cristas brilhantes -->
  <svg class="loading-sea-wave loading-sea-wave-5" viewBox="0 0 1440 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(60,140,220,0.28)"
      d="M0,20 C100,10 200,30 300,20 C400,10 500,30 600,20
         C700,10 800,30 900,20 C1000,10 1100,30 1200,20
         C1300,10 1400,30 1440,20 C1540,10 1640,30 1740,20
         C1840,10 1940,30 2040,20 C2140,10 2240,30 2340,20
         C2440,10 2540,30 2640,20 C2740,10 2840,30 2940,20
         C3040,10 3140,30 3240,20 C3340,10 3440,30 3540,20
         C3640,10 3740,30 3840,20 C3940,10 4040,30 4140,20
         C4240,10 4320,30 4320,20 L4320,60 L0,60 Z"/>
  </svg>
</div>

<!-- Style 3: Spinner grande centralizado -->
<div id="loading-spinner" class="loading-spinner">
  <div class="loading-spinner-wrap">
    <div class="loading-spinner-outer">
      <svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="110" cy="110" r="104" stroke="rgba(79,134,185,0.15)" stroke-width="5"/>
        <circle cx="110" cy="110" r="104" stroke="url(#arc-grad-outer)" stroke-width="5" stroke-dasharray="160 495" stroke-linecap="round" transform="rotate(-90 110 110)"/>
        <defs>
          <linearGradient id="arc-grad-outer" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7ec8e3" stop-opacity="0.1"/>
            <stop offset="50%" stop-color="#4f86b9" stop-opacity="1"/>
            <stop offset="100%" stop-color="#7ec8e3" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="loading-spinner-inner">
      <svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="90" cy="90" r="82" stroke="rgba(201,156,78,0.12)" stroke-width="3"/>
        <circle cx="90" cy="90" r="82" stroke="url(#arc-grad-inner)" stroke-width="3" stroke-dasharray="90 425" stroke-linecap="round" transform="rotate(90 90 90)"/>
        <defs>
          <linearGradient id="arc-grad-inner" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c99c4e" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#c99c4e" stop-opacity="0.95"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <img class="loading-spinner-icon" src="{% static 'game/units/trieme.png' %}" alt="">
    <span class="loading-spinner-label">Navegando...</span>
  </div>
</div>

<!-- Style toggle button (bottom-right corner) -->
{% if user.is_authenticated %}
<button id="ik-loading-toggle" class="ik-loading-toggle" onclick="ikCycleLoadingStyle()" title="Estilo de loading">
  <i class="bi bi-stars"></i>
</button>
{% endif %}

<script>
(function () {
  var STYLES = ['2', '3'];
  var LABELS  = { '2': 'Mar', '3': 'Spinner' };

  function getStyle() {
    var s = localStorage.getItem('ikLoadingStyle') || '3';
    return STYLES.indexOf(s) >= 0 ? s : '3';
  }
  function setStyle(s) { localStorage.setItem('ikLoadingStyle', s); applyStyle(s); }

  function applyStyle(s) {
    ['loading-sea', 'loading-spinner'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.setAttribute('data-style', s);
    });
    var btn = document.getElementById('ik-loading-toggle');
    if (btn) btn.title = 'Loading: ' + (LABELS[s] || s) + ' (clique para trocar)';
  }

  window.ikCycleLoadingStyle = function () {
    var idx  = STYLES.indexOf(getStyle());
    var next = STYLES[(idx + 1) % STYLES.length];
    setStyle(next);
  };

  applyStyle(getStyle());
})();
</script>
