{% load static %}
<!-- Loading indicators: 2 estilos, toggle via botão no canto. Pref em localStorage ikLoadingStyle -->

<!-- Style 2: Oceano 45vh — waterline animada com top negativo, corpo gradiente -->
<div id="loading-sea" class="loading-sea">
  <div class="loading-sea-bg"></div>

  <!--
    Técnica: cada SVG tem top negativo → container overflow:hidden clipa o topo.
    A crista da onda aparece na borda do container, fill = cor do fundo → sem seam.
    viewBox height = CSS height para proporção 1:1 (sem distorção).
  -->

  <!-- Onda 1 — base, lenta (7s), top=-45px, height=160px.
       Crista visível em ~-45+60=15px do topo do container. -->
  <svg class="loading-sea-wave loading-sea-wave-1" viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="#0e2f68"
      d="M0,60 C240,28 480,92 720,60 C960,28 1200,92 1440,60
         C1680,28 1920,92 2160,60 C2400,28 2640,92 2880,60
         C3120,28 3360,92 3600,60 C3840,28 4080,92 4320,60
         L4320,160 L0,160 Z"/>
  </svg>

  <!-- Onda 2 — média reversa (4.5s), top=-30px, height=120px.
       Crista visível em ~-30+50=20px. Cor um pouco mais escura. -->
  <svg class="loading-sea-wave loading-sea-wave-2" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(10,28,62,0.92)"
      d="M0,50 C200,22 400,78 600,50 C800,22 1000,78 1200,50
         C1400,22 1600,78 1800,50 C2000,22 2200,78 2400,50
         C2600,22 2800,78 3000,50 C3200,22 3400,78 3600,50
         C3800,22 4000,78 4200,50 L4200,120 L0,120 Z"/>
  </svg>

  <!-- Onda 3 — superfície (3s), top=-20px, height=85px.
       Azul ligeiramente mais vivo, semi-transparente. -->
  <svg class="loading-sea-wave loading-sea-wave-3" viewBox="0 0 1440 85" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(16,52,118,0.78)"
      d="M0,36 C160,14 320,58 480,36 C640,14 800,58 960,36
         C1120,14 1280,58 1440,36 C1600,14 1760,58 1920,36
         C2080,14 2240,58 2400,36 C2560,14 2720,58 2880,36
         C3040,14 3200,58 3360,36 C3520,14 3680,58 3840,36
         C4000,14 4160,58 4320,36 L4320,85 L0,85 Z"/>
  </svg>

  <!-- Onda 4 — espuma rápida (2s), top=-12px, height=55px.
       Translúcida, crista quase na borda do container. -->
  <svg class="loading-sea-wave loading-sea-wave-4" viewBox="0 0 1440 55" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path fill="rgba(30,85,175,0.38)"
      d="M0,24 C120,10 240,38 360,24 C480,10 600,38 720,24
         C840,10 960,38 1080,24 C1200,10 1320,38 1440,24
         C1560,10 1680,38 1800,24 C1920,10 2040,38 2160,24
         C2280,10 2400,38 2520,24 C2640,10 2760,38 2880,24
         C3000,10 3120,38 3240,24 C3360,10 3480,38 3600,24
         C3720,10 3840,38 3960,24 C4080,10 4200,38 4320,24
         L4320,55 L0,55 Z"/>
  </svg>
</div>

<!-- Style 3: Spinner grande centralizado -->
<div id="loading-spinner" class="loading-spinner">
  <div class="loading-spinner-wrap">
    <div class="loading-spinner-outer">
      <svg viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="110" cy="110" r="104" stroke="rgba(79,134,185,0.15)" stroke-width="5"/>
        <circle cx="110" cy="110" r="104" stroke="url(#arc-grad-outer)" stroke-width="5" stroke-dasharray="160 495" stroke-linecap="round" transform="rotate(-90 110 110)"/>
        <defs>
          <linearGradient id="arc-grad-outer" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7ec8e3" stop-opacity="0.1"/>
            <stop offset="50%" stop-color="#4f86b9" stop-opacity="1"/>
            <stop offset="100%" stop-color="#7ec8e3" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="loading-spinner-inner">
      <svg viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="90" cy="90" r="82" stroke="rgba(201,156,78,0.12)" stroke-width="3"/>
        <circle cx="90" cy="90" r="82" stroke="url(#arc-grad-inner)" stroke-width="3" stroke-dasharray="90 425" stroke-linecap="round" transform="rotate(90 90 90)"/>
        <defs>
          <linearGradient id="arc-grad-inner" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#c99c4e" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#c99c4e" stop-opacity="0.95"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <img class="loading-spinner-icon" src="{% static 'game/units/trieme.png' %}" alt="">
    <span class="loading-spinner-label">Navegando...</span>
  </div>
</div>

<!-- Style toggle button (bottom-right corner) -->
{% if user.is_authenticated %}
<button id="ik-loading-toggle" class="ik-loading-toggle" onclick="ikCycleLoadingStyle()" title="Estilo de loading">
  <i class="bi bi-stars"></i>
</button>
{% endif %}

<script>
(function () {
  var STYLES = ['2', '3'];
  var LABELS  = { '2': 'Mar', '3': 'Spinner' };

  function getStyle() {
    var s = localStorage.getItem('ikLoadingStyle') || '3';
    return STYLES.indexOf(s) >= 0 ? s : '3';
  }
  function setStyle(s) { localStorage.setItem('ikLoadingStyle', s); applyStyle(s); }

  function applyStyle(s) {
    ['loading-sea', 'loading-spinner'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.setAttribute('data-style', s);
    });
    var btn = document.getElementById('ik-loading-toggle');
    if (btn) btn.title = 'Loading: ' + (LABELS[s] || s) + ' (clique para trocar)';
  }

  window.ikCycleLoadingStyle = function () {
    var idx  = STYLES.indexOf(getStyle());
    var next = STYLES[(idx + 1) % STYLES.length];
    setStyle(next);
  };

  applyStyle(getStyle());
})();
</script>
