# ikabot telemetry stack: receiver API + Postgres + Grafana behind a tiny gateway.
# Public entrypoint: the gateway (port ${TELEMETRY_PORT:-8088}); point the reverse
# proxy (e.g. Nginx Proxy Manager) for telemetry.<your-domain> at it.
name: ikabot-telemetry

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: ${TELEMETRY_DB_PASSWORD:?set TELEMETRY_DB_PASSWORD}
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:?set GRAFANA_RO_PASSWORD}
    volumes:
      - telemetry-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  api:
    build: ./api
    image: ikabot-telemetry-api:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://telemetry:${TELEMETRY_DB_PASSWORD}@db:5432/telemetry
      GEOIP_AUTO_UPDATE: ${GEOIP_AUTO_UPDATE:-true}
    volumes:
      - geoip:/data/geoip
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${TELEMETRY_PUBLIC_URL:-http://localhost:8088}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ikabot-overview.json
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${TELEMETRY_PORT:-8088}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api, grafana]
    networks: [internal]

volumes:
  telemetry-db:
  grafana-data:
  geoip:

networks:
  internal:
