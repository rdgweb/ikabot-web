# No access log at all: client IPs are stored only where the receiver deliberately
# keeps them (install_ips table, 90 days), never in log files.
access_log off;
error_log /dev/stderr warn;

# Real client address: prefer what the outer reverse proxy (e.g. Nginx Proxy Manager) sets.
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    server_tokens off;

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header Host $http_host;
    }
}
