# No access log at all: client IPs are stored only where the receiver deliberately
# keeps them (install_ips table, 90 days), never in log files.
access_log off;
error_log /dev/stderr warn;

# Real client address, in order of preference:
#   1. CF-Connecting-IP - set by Cloudflare (X-Real-IP would be a Cloudflare edge address);
#   2. X-Real-IP        - set by the outer reverse proxy (e.g. Nginx Proxy Manager);
#   3. the TCP peer.
map $http_cf_connecting_ip $ip_after_cf {
    default $http_cf_connecting_ip;
    ""      $http_x_real_ip;
}
map $ip_after_cf $client_ip {
    default $ip_after_cf;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;
    server_tokens off;

    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /grafana/api/live/ {
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header Host $http_host;
    }
}
