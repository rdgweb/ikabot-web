name: Validate and Publish Docker Images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      hub_version: ${{ steps.versions.outputs.hub_version }}
      agent_version: ${{ steps.versions.outputs.agent_version }}
      supervisor_version: ${{ steps.versions.outputs.supervisor_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve comparison base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate component versions
        id: versions
        shell: bash
        run: |
          args=(--github-output "$GITHUB_OUTPUT")
          if [[ -n "${{ steps.base.outputs.ref }}" ]]; then
            args+=(--base "${{ steps.base.outputs.ref }}")
          fi
          python .github/scripts/version_guard.py "${args[@]}"

      - name: Test version rules
        run: python .github/scripts/test_version_guard.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: hub
            context: ./hub_v2
            image: blackoneal/ikabot-web-hub
            version_output: hub_version
          - component: agent
            context: ./agent_v2
            image: blackoneal/ikabot-web-agent
            version_output: agent_version
          - component: supervisor
            context: ./supervisor_v1
            image: blackoneal/ikabot-web-supervisor
            version_output: supervisor_version
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # N-79: only "latest" (mutable) + "vX.Y.Z" (permanent) going
          # forward — the plain "X.Y.Z" twin and the per-commit "sha-*" tag
          # were pure duplicates of the same image and nothing resolves
          # images by either (apps/notes/services.py's get_registry_release()
          # already strips an optional "v" prefix, so it works from vX.Y.Z
          # alone). They're what grew Docker Hub to ~500 tags/~50GB across
          # the 3 repos — see .github/workflows/dockerhub-cleanup.yml.
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=v${{ needs.validate.outputs[matrix.version_output] }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXPECTED_AGENT_VERSION=${{ needs.validate.outputs.agent_version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  dockerhub-description:
    # N-79: keep each Docker Hub repository's description/readme in sync with
    # the repo automatically — a published image with no description is what
    # this note is about, and a stale one manually edited on Docker Hub would
    # just drift again.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: blackoneal/ikabot-web-hub
            readme: hub_v2/DOCKERHUB.md
            short: "Web panel & job queue for automating Ikariam multi-account play. Needs ikabot-web-agent."
          - image: blackoneal/ikabot-web-agent
            readme: agent_v2/DOCKERHUB.md
            short: "Worker that executes queued Ikariam actions for ikabot-web-hub. Scale out with extra agents."
          - image: blackoneal/ikabot-web-supervisor
            readme: supervisor_v1/DOCKERHUB.md
            short: "Outbound-only sidecar applying ikabot-web-agent updates requested from the Hub."
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push description to Docker Hub
        # Docker Hub's description API needs a token with read/write/DELETE
        # scope, stricter than the read/write scope that's enough for the
        # build job's image push above. continue-on-error so a scope
        # mismatch here (or any Docker Hub hiccup) never fails the whole
        # run over a cosmetic sync — the actual image publish already
        # succeeded by the time this job starts.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ matrix.image }}
          readme-filepath: ${{ matrix.readme }}
          short-description: ${{ matrix.short }}
          enable-url-completion: true
