name: Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata - hub
        id: meta_hub
        uses: docker/metadata-action@v5
        with:
          images: blackoneal/ikabot-web-hub
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=tag

      - name: Docker metadata - agent
        id: meta_agent
        uses: docker/metadata-action@v5
        with:
          images: blackoneal/ikabot-web-agent
          tags: |
            type=raw,value=latest
            type=sha
            type=ref,event=tag

      - name: Build and push hub
        uses: docker/build-push-action@v6
        with:
          context: ./hub_v2
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_hub.outputs.tags }}
          labels: ${{ steps.meta_hub.outputs.labels }}

      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: ./agent_v2
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_agent.outputs.tags }}
          labels: ${{ steps.meta_agent.outputs.labels }}
